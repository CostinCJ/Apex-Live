name: PR Quality Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apex_live_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://apex:test@localhost:5432/apex_live_test
      JWT_ACCESS_SECRET: test-access-secret-for-ci
      JWT_REFRESH_SECRET: test-refresh-secret-for-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install server dependencies
        run: cd server && npm ci

      - name: TypeScript check (client)
        run: npx tsc --noEmit

      - name: TypeScript check (server)
        run: cd server && npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --max-warnings 0

      - name: Run database migrations
        run: cd server && npx prisma migrate deploy

      - name: Unit tests
        run: npx jest --ci --coverage --maxWorkers=2
