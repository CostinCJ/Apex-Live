name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apex_live_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://apex:test@localhost:5432/apex_live_test
      JWT_ACCESS_SECRET: test-access-secret-for-ci
      JWT_REFRESH_SECRET: test-refresh-secret-for-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install server dependencies
        run: cd server && npm ci

      - name: TypeScript check (client)
        run: npx tsc --noEmit

      - name: TypeScript check (server)
        run: cd server && npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --max-warnings 0

      - name: Run database migrations
        run: cd server && npx prisma migrate deploy

      - name: Unit tests
        run: npx jest --ci --maxWorkers=2

  build-server:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-mobile:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview (push to main)
        if: github.ref == 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        run: eas build --profile preview --platform all --non-interactive

      - name: Build production (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: eas build --profile production --platform all --non-interactive

      - name: Upload source maps to Sentry
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx sentry-cli sourcemaps upload --release=${{ github.ref_name }} ./dist
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        continue-on-error: true

      - name: Submit to stores (production tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          eas submit --platform ios --non-interactive
          eas submit --platform android --non-interactive
